<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>استوديو المنتجات AI</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080810;font-family:'Tajawal',sans-serif;color:#eee;min-height:100vh;direction:rtl}

header{background:#0d0d1a;border-bottom:1px solid #1a1a30;padding:1rem 1.5rem;display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#7C3AED,#EC4899);display:flex;align-items:center;justify-content:center;font-size:20px}
.logo-text h1{font-size:16px;font-weight:800}
.logo-text p{font-size:11px;color:#555;margin-top:2px}
.badge{margin-right:auto;background:#12122a;border:1px solid #2a2a50;border-radius:20px;padding:3px 12px;font-size:11px;color:#7C3AED}

.container{max-width:800px;margin:0 auto;padding:1.5rem;display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:600px){.container{grid-template-columns:1fr}}

.panel{display:flex;flex-direction:column;gap:14px}
.label{font-size:11px;color:#555;font-weight:600;margin-bottom:6px;letter-spacing:0.5px}

.upload-zone{border:2px dashed #2a2a40;border-radius:16px;background:#0f0f22;min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;position:relative;transition:all 0.2s}
.upload-zone:hover{border-color:#7C3AED;background:#13102a}
.upload-zone.has-img{border-style:solid;border-color:#2a2a40}
.upload-zone img{width:100%;max-height:200px;object-fit:contain;display:block}
.upload-hint{text-align:center;color:#333}
.upload-hint .icon{font-size:40px;opacity:0.4;margin-bottom:8px}
.upload-hint p{font-size:13px;color:#444}
.upload-hint span{font-size:11px;color:#333;margin-top:4px;display:block}
.change-badge{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.75);border-radius:8px;padding:3px 10px;font-size:11px;color:#999}

.angles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.angle-btn{border:1.5px solid #1e1e38;border-radius:12px;background:#0f0f22;color:#555;padding:12px 8px;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Tajawal',sans-serif}
.angle-btn:hover{border-color:#7C3AED;color:#a78bfa}
.angle-btn.active{border:2px solid #7C3AED;background:#1a1030;color:#a78bfa}
.angle-btn .arrow{font-size:22px;margin-bottom:4px}
.angle-btn .name{font-size:12px;font-weight:600}
.angle-btn .eng{font-size:10px;opacity:0.5;margin-top:2px}

.directions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dir-btn{border:1.5px solid #1e1e38;border-radius:12px;background:#0f0f22;color:#555;padding:10px 8px;cursor:pointer;text-align:center;transition:all 0.15s;font-family:'Tajawal',sans-serif}
.dir-btn:hover{border-color:#10B981;color:#34D399}
.dir-btn.active{border:2px solid #10B981;background:#0a1f18;color:#34D399}
.dir-btn .arrow{font-size:20px;margin-bottom:4px}
.dir-btn .name{font-size:11px;font-weight:600}

.gen-btn{width:100%;padding:14px;border-radius:14px;border:none;background:#111128;color:#333;font-size:14px;font-weight:700;cursor:not-allowed;font-family:'Tajawal',sans-serif;transition:all 0.2s}
.gen-btn.ready{background:linear-gradient(135deg,#7C3AED,#EC4899);color:#fff;cursor:pointer}
.gen-btn.ready:hover{opacity:0.9}
.gen-btn.loading{background:#1a1030;color:#a78bfa;cursor:wait}

.result-panel{display:flex;flex-direction:column;gap:12px}
.result-box{border:1.5px solid #1e1e38;border-radius:16px;background:#0d0d1a;min-height:340px;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.result-box img{width:100%;height:100%;object-fit:contain;border-radius:14px}
.result-placeholder{text-align:center;color:#333}
.result-placeholder .icon{font-size:48px;margin-bottom:12px}
.result-placeholder p{font-size:13px}
.result-actions{position:absolute;bottom:10px;left:10px;right:10px;display:flex;gap:8px}
.result-actions button{flex:1;background:rgba(0,0,0,0.8);backdrop-filter:blur(8px);border:1px solid #2a2a50;border-radius:10px;padding:8px;color:#a78bfa;font-size:12px;cursor:pointer;font-family:'Tajawal',sans-serif}
.result-actions button.green{color:#34D399}

.spinner{font-size:36px;animation:spin 1.2s linear infinite;display:block;margin-bottom:12px}
.step-text{font-size:13px;color:#555}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

.orig-box{border:1px solid #1e1e38;border-radius:12px;overflow:hidden;height:110px;background:#0d0d1a}
.orig-box img{width:100%;height:100%;object-fit:contain}

.error{background:#1a0a0a;border:1px solid #4a1515;border-radius:12px;padding:12px;color:#f87171;font-size:13px}
</style>
</head>
<body>

<header>
  <div class="logo">📸</div>
  <div class="logo-text">
    <h1>استوديو المنتجات AI</h1>
    <p>يولد صور احترافية بالذكاء الاصطناعي</p>
  </div>
  <div class="badge">Stability AI + Claude</div>
</header>

<div class="container">
  <!-- LEFT -->
  <div class="panel">

    <!-- Upload -->
    <div>
      <div class="label">📁 صورة المنتج</div>
      <div class="upload-zone" id="uploadZone" onclick="document.getElementById('fileInput').click()">
        <div class="upload-hint" id="uploadHint">
          <div class="icon">🖼</div>
          <p>اسحب صورة المنتج أو اضغط للرفع</p>
          <span>PNG · JPG · WEBP</span>
        </div>
        <img id="previewImg" style="display:none"/>
        <div class="change-badge" id="changeBadge" style="display:none">اضغط لتغيير</div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none"/>
    </div>

    <!-- Angle -->
    <div>
      <div class="label">📐 زاوية التصوير</div>
      <div class="angles">
        <button class="angle-btn" data-angle="front" onclick="selectAngle('front')">
          <div class="arrow">⬆</div>
          <div class="name">أمامية</div>
          <div class="eng">Front View</div>
        </button>
        <button class="angle-btn" data-angle="back" onclick="selectAngle('back')">
          <div class="arrow">⬇</div>
          <div class="name">خلفية</div>
          <div class="eng">Back View</div>
        </button>
        <button class="angle-btn" data-angle="side" onclick="selectAngle('side')">
          <div class="arrow">↔</div>
          <div class="name">جانبية</div>
          <div class="eng">Side View</div>
        </button>
      </div>
    </div>

    <!-- Direction -->
    <div id="dirSection" style="display:none">
      <div class="label">🧭 اتجاه الكاميرا</div>
      <div class="directions">
        <button class="dir-btn" data-dir="left" onclick="selectDir('left')">
          <div class="arrow">←</div>
          <div class="name">يسار</div>
        </button>
        <button class="dir-btn" data-dir="right" onclick="selectDir('right')">
          <div class="arrow">→</div>
          <div class="name">يمين</div>
        </button>
        <button class="dir-btn" data-dir="top-left" onclick="selectDir('top-left')">
          <div class="arrow">↖</div>
          <div class="name">أعلى يسار</div>
        </button>
        <button class="dir-btn" data-dir="top-right" onclick="selectDir('top-right')">
          <div class="arrow">↗</div>
          <div class="name">أعلى يمين</div>
        </button>
      </div>
    </div>

    <!-- Generate -->
    <button class="gen-btn" id="genBtn" onclick="generate()">
      ✦ ولّد الصورة الاحترافية
    </button>

    <div id="errorBox" style="display:none" class="error"></div>
  </div>

  <!-- RIGHT -->
  <div class="result-panel">
    <div class="label">✨ الصورة الناتجة</div>
    <div class="result-box" id="resultBox">
      <div class="result-placeholder" id="resultPlaceholder">
        <div class="icon">🏷</div>
        <p>الصورة المولّدة ستظهر هنا</p>
      </div>
    </div>

    <div id="origSection" style="display:none">
      <div class="label">الصورة الأصلية</div>
      <div class="orig-box">
        <img id="origThumb"/>
      </div>
    </div>
  </div>
</div>

<script>
let imgBase64 = null, imgType = null, angle = null, direction = null, loading = false;

document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));
document.getElementById('uploadZone').addEventListener('dragover', e => { e.preventDefault(); });
document.getElementById('uploadZone').addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  imgType = file.type;
  const reader = new FileReader();
  reader.onload = e => {
    imgBase64 = e.target.result.split(',')[1];
    document.getElementById('previewImg').src = e.target.result;
    document.getElementById('previewImg').style.display = 'block';
    document.getElementById('uploadHint').style.display = 'none';
    document.getElementById('changeBadge').style.display = 'block';
    document.getElementById('uploadZone').classList.add('has-img');
    document.getElementById('origThumb').src = e.target.result;
    document.getElementById('origSection').style.display = 'block';
    checkReady();
  };
  reader.readAsDataURL(file);
}

function selectAngle(a) {
  angle = a;
  document.querySelectorAll('.angle-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-angle="'+a+'"]').classList.add('active');
  document.getElementById('dirSection').style.display = a === 'side' ? 'block' : 'none';
  if (a !== 'side') direction = null;
  checkReady();
}

function selectDir(d) {
  direction = d;
  document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-dir="'+d+'"]').classList.add('active');
  checkReady();
}

function checkReady() {
  const ready = imgBase64 && angle && (angle !== 'side' || direction);
  const btn = document.getElementById('genBtn');
  btn.classList.toggle('ready', ready && !loading);
  btn.disabled = !ready || loading;
}

function setStep(text) {
  const box = document.getElementById('resultBox');
  box.innerHTML = `<div style="text-align:center"><span class="spinner">⟳</span><div class="step-text">${text}</div></div>`;
}

async function generate() {
  if (loading) return;
  loading = true;
  document.getElementById('errorBox').style.display = 'none';
  checkReady();

  try {
    setStep('🔍 تحليل المنتج...');
    const analyzeRes = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ imageBase64: imgBase64, imageType: imgType, angle, direction })
    });
    const analyzeData = await analyzeRes.json();
    if (!analyzeRes.ok) throw new Error(analyzeData.error || 'خطأ في التحليل');

    setStep('🎨 جاري توليد الصورة الاحترافية...');
    const genRes = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        imageBase64: imgBase64,
        imageType: imgType,
        prompt: analyzeData.prompt,
        negativePrompt: 'blurry, low quality, distorted, ugly, text, watermark, people, hands, dark background'
      })
    });
    const genData = await genRes.json();
    if (!genRes.ok) throw new Error(genData.error || 'خطأ في التوليد');

    const src = 'data:image/png;base64,' + genData.image;
    document.getElementById('resultBox').innerHTML = `
      <img src="${src}" alt="result"/>
      <div class="result-actions">
        <button onclick="downloadImg('${src}')">⬇ تحميل</button>
        <button class="green" onclick="generate()">↺ أعد التوليد</button>
      </div>`;
  } catch(e) {
    document.getElementById('resultBox').innerHTML = `<div class="result-placeholder"><div class="icon">❌</div><p>حدث خطأ</p></div>`;
    document.getElementById('errorBox').textContent = '⚠ ' + e.message;
    document.getElementById('errorBox').style.display = 'block';
  }

  loading = false;
  checkReady();
}

function downloadImg(src) {
  const a = document.createElement('a');
  a.href = src;
  a.download = 'product_' + Date.now() + '.png';
  a.click();
}
</script>
</body>
</html>
